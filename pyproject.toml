[project]
name = "footfall-cam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ziad megahed", email = "ziadmegahed074@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.2",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
package = false